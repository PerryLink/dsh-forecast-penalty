<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="t d">
<title id="t">dsh-forecast-penalty rule scoreboard</title>
<desc id="d">Two inputs (a JSON/YAML material and the seven-rule pack) feed one scoreboard: seven rows give rule, field, check kind, basis-to-severity cap and disposition. The two arithmetic rules carry an instrument: FP-003 a tolerance ruler (declared 88.00 against expected 96.6, tolerance plus or minus 1.5 percentage points) and FP-004 an equation receipt (80 x 50 = 4000, declared 4000, difference 0 within 0.01). Below the panel sit the two exits: issues[] with one located finding, and skipped[] with the three reasons a rule can land there. The verdict stays with the reviewer.</desc>
